<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Viewer</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #212529;
      background: #fff;
    }

    .viewer {
      width: 100%;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding: 0.75rem;
      border-bottom: 1px solid #dee2e6;
      background: #f8f9fa;
    }

    .toolbar button,
    .toolbar a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 7rem;
      padding: 0.55rem 0.9rem;
      border: 1px solid #ced4da;
      border-radius: 0.4rem;
      background: #fff;
      color: #212529;
      text-decoration: none;
      font: inherit;
      cursor: pointer;
    }

    .toolbar button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      min-width: 12rem;
      text-align: center;
      font-weight: 600;
    }

    .canvas-wrap {
      padding: 0.75rem;
      background: #f8f9fa;
    }

    #pdf-canvas {
      display: block;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 0.5rem;
    }

    .message {
      padding: 1rem;
      text-align: center;
      color: #6c757d;
    }
  </style>
</head>

<body>
  <div class="viewer">
    <div class="toolbar">
      <button id="prev-page" type="button" disabled>Previous</button>
      <div id="page-status" class="status">Loading...</div>
      <button id="next-page" type="button" disabled>Next</button>
      <a id="download-pdf" href="#" download>Download PDF</a>
    </div>
    <div class="canvas-wrap">
      <canvas id="pdf-canvas"></canvas>
      <div id="pdf-message" class="message">Loading PDF...</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    function getParams() {
      const frameData = window.frameElement ? window.frameElement.dataset : {};
      const searchParams = new URLSearchParams(window.location.search);
      const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : window.location.hash;
      const hashParams = new URLSearchParams(hash);
      return {
        get: function (key) {
          const datasetKey = key.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
          return frameData[datasetKey] || searchParams.get(key) || hashParams.get(key);
        }
      };
    }

    const params = getParams();
    const file = params.get("file");
    const startParam = parseInt(params.get("start") || "1", 10);
    const endParam = parseInt(params.get("end") || "0", 10);
    const initialParam = parseInt(params.get("page") || String(startParam), 10);

    const prevButton = document.getElementById("prev-page");
    const nextButton = document.getElementById("next-page");
    const downloadLink = document.getElementById("download-pdf");
    const status = document.getElementById("page-status");
    const message = document.getElementById("pdf-message");
    const canvas = document.getElementById("pdf-canvas");
    const context = canvas.getContext("2d");

    let pdfDocument = null;
    let startPage = Math.max(1, startParam);
    let endPage = endParam;
    let currentPage = Math.max(1, initialParam);
    let renderToken = 0;

    function setMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    function clearMessage() {
      message.style.display = "none";
    }

    function updateControls() {
      const relativeIndex = currentPage - startPage + 1;
      const totalShown = endPage - startPage + 1;
      status.textContent = "Slide " + relativeIndex + " of " + totalShown;
      prevButton.disabled = currentPage <= startPage;
      nextButton.disabled = currentPage >= endPage;
    }

    async function renderPage(pageNumber) {
      const page = await pdfDocument.getPage(pageNumber);
      const baseViewport = page.getViewport({ scale: 1 });
      const availableWidth = Math.max(320, canvas.parentElement.clientWidth - 24);
      const scale = availableWidth / baseViewport.width;
      const viewport = page.getViewport({ scale: scale });
      const outputScale = window.devicePixelRatio || 1;
      const token = ++renderToken;

      canvas.width = Math.floor(viewport.width * outputScale);
      canvas.height = Math.floor(viewport.height * outputScale);
      canvas.style.width = viewport.width + "px";
      canvas.style.height = viewport.height + "px";

      const renderContext = {
        canvasContext: context,
        transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null,
        viewport: viewport,
      };

      clearMessage();
      await page.render(renderContext).promise;

      if (token !== renderToken) {
        return;
      }

      updateControls();
    }

    async function goToPage(pageNumber) {
      currentPage = Math.min(endPage, Math.max(startPage, pageNumber));
      setMessage("Loading slide...");
      await renderPage(currentPage);
    }

    prevButton.addEventListener("click", function () {
      if (currentPage > startPage) {
        goToPage(currentPage - 1);
      }
    });

    nextButton.addEventListener("click", function () {
      if (currentPage < endPage) {
        goToPage(currentPage + 1);
      }
    });

    window.addEventListener("keydown", function (event) {
      if (event.key === "ArrowLeft" && currentPage > startPage) {
        goToPage(currentPage - 1);
      }
      if (event.key === "ArrowRight" && currentPage < endPage) {
        goToPage(currentPage + 1);
      }
    });

    let resizeTimer = null;
    window.addEventListener("resize", function () {
      if (!pdfDocument) {
        return;
      }
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(function () {
        goToPage(currentPage);
      }, 150);
    });

    async function init() {
      if (!file) {
        setMessage("Missing PDF file.");
        status.textContent = "Unavailable";
        downloadLink.style.display = "none";
        return;
      }

      downloadLink.href = file;

      try {
        pdfDocument = await pdfjsLib.getDocument(file).promise;
        endPage = endPage > 0 ? Math.min(endPage, pdfDocument.numPages) : pdfDocument.numPages;
        startPage = Math.min(startPage, endPage);
        currentPage = Math.min(Math.max(currentPage, startPage), endPage);
        await goToPage(currentPage);
      } catch (error) {
        console.error(error);
        setMessage("The PDF could not be loaded.");
        status.textContent = "Unavailable";
      }
    }

    init();
  </script>
</body>

</html>
