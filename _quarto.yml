project:
  type: website
  output-dir: docs

website:
  title: "Real Good Docs"
  favicon: assets/images/logo/favicon.ico
  page-navigation: true
  search: true

  navbar:
    background: black
    type: dark 
    border: true
    right:
      - href: https://data.realgoodresearch.com
        text: Data
      - href: https://docs.realgoodresearch.com
        text: Docs
      - href: https://github.com/realgoodresearch
        target: _blank
        text: Code
      - href: https://realgoodresearch.com
        text: Home
  sidebar: 
    - id: bayesian-intro-sidebar
      title: "Bayesian Intro"
      path: books/bayesian-intro/
      contents: 
        - text: "Welcome"
          href: books/bayesian-intro/overview.qmd
        - text: "Table of Contents"
          href: books/bayesian-intro/toc.qmd
        - text: "Getting Started" 
          href: books/bayesian-intro/getting-started.qmd
        - section: "Lecture Slides"
          contents: 
          - text: "Intro to Bayesian Inference"
            href: books/bayesian-intro/lecture-intro-to-bayesian-inference.qmd
          - text: "GLMs and Hierarchical Models"
            href: books/bayesian-intro/lecture-glm-and-hierarchical-models.qmd
        - section: "Practical Tutorials"
          contents:
          - text: "Model of the Mean"
            href: books/bayesian-intro/practical-model-of-the-mean.qmd
          - text: "Exploring Posteriors, Likelihoods, and Priors"
            href: books/bayesian-intro/practical-posteriors-likelihoods-priors.qmd
          - text: "MCMC Toy Example"
            href: books/bayesian-intro/practical-mcmc-toy.qmd
          - text: "Gaussian Linear Regression"
            href: books/bayesian-intro/practical-gaussian-linear-regression.qmd
          - text: "Synthetic Controls"
            href: books/bayesian-intro/practical-synthetic-controls.qmd
    - id: gaza-nowpop-sidebar
      title: "Gaza NowPop"
      path: books/nowpop/
      contents: 
        - text: "Introduction"
          href: books/nowpop/overview.qmd
        - text: "Table of Contents"
          href: books/nowpop/toc.qmd
        - text: "Gaza Telecoms"
          href: books/nowpop/gaza-nowpop-telecoms.qmd
        - text: "Ukraine Telecoms"
          href: books/nowpop/ukraine-nowpop-telecoms.qmd
    - id: tent-mapping-sidebar
      title: "Tent Mapping"
      path: books/tent-mapping/
      contents:
        - text: "Introduction"
          href: books/tent-mapping/overview.qmd
        - text: "Table of Contents"
          href: books/tent-mapping/toc.qmd
        - text: "TentNetFA Overview"
          href: books/tent-mapping/tentnetfa.qmd

format:
  html:
    theme: 
      - cosmo
      - custom-theme.scss
    include-in-header: assets/pdf-viewer-head.html
    include-after-body: _footer.html
    toc: true
    number-sections: false
    bibliography: references.bib

execute:
  freeze: auto
